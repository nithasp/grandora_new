<div class="add-coin" #selectElem>
  <div class="add-coin-header">
    <h1>Add Coin</h1>
    <div class="close-btn" (click)="handleClose()">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="29"
        height="30"
        viewBox="0 0 29 30"
        fill="none"
      >
        <rect
          x="6.48145"
          y="8.51953"
          width="2"
          height="20"
          rx="1"
          transform="rotate(-45 6.48145 8.51953)"
          fill="white"
        />
        <rect
          x="20.625"
          y="7.33984"
          width="2"
          height="20"
          rx="1"
          transform="rotate(45 20.625 7.33984)"
          fill="white"
        />
      </svg>
    </div>
  </div>
  <div class="wrapper">
    <div class="add-coin-content">
      <ng-container *ngIf="isLogin; else signedOut">
        <div class="currency">
          <h3>Currency</h3>
          <app-grandora-select
            class="select-currency"
            [optionItems]="currencyOptions"
            optionPlaceholder="MYGG Coins"
            (changeTopic)="handleCurrency($event)"
          ></app-grandora-select>
        </div>
        <div class="category">
          <h3>{{ kind === 'coins' ? 'Top up MYGG Coins' : 'Grando Package' }}</h3>
          <div class="package">
            <div
              class="item"
              *ngFor="let item of package"
              (click)="handlePackage(item)"
            >
              <app-package-card [item]="item"></app-package-card>
            </div>
            <p class="empty" *ngIf="!package.length">
              {{ loadError || 'Loading packages...' }}
            </p>
          </div>
        </div>
      </ng-container>
      <ng-template #signedOut>
        <div class="signed-out">
          <p>Sign in to top up MYGG Coins and buy Grando packages.</p>
          <button class="linear-btn-grandora" (click)="handleSignIn()">
            <span>Sign In</span>
          </button>
        </div>
      </ng-template>
    </div>
    <div class="add-coin-footer">
      <div class="point">
        <div class="item item1" title="MYGG Coins">
          <img src="/assets/images/package/Polygon 3.png" alt="MYGG Coins" />
          <span>{{ balances?.myggCoins ?? 0 | number }}</span>
        </div>
        <div class="item item2" title="Grando">
          <img src="/assets/images/official-store/Group.png" alt="Grando" />
          <span>{{ balances?.grando ?? 0 | number }}</span>
        </div>
      </div>
      <div class="btn-wrapper">
        <button class="linear-btn-grandora" (click)="handlePageChange()">
          <span>Package</span>
        </button>
      </div>
    </div>
  </div>
</div>
