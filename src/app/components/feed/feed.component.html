<div class="feed">
  <div class="wrapper" [style.height]="feedHeight">
    <div class="item" *ngFor="let item of posts">
      <div class="info-section1">
        <div class="profile-header">
          <div class="profile-image">
            <img src="{{ item.profile_icon }}" />
          </div>
          <div class="profile-info">
            <div class="name">{{ item.name }}</div>
            <div class="date">{{ item.date }}</div>
          </div>
        </div>
        <div class="content">
          {{ item.description }}
        </div>
        <div class="grid-image" *ngIf="item.image">
          <img src="assets/images/mockup/feed/Rectangle 1320.png" />
          <img src="assets/images/mockup/feed/Rectangle 1320.png" />
          <img src="assets/images/mockup/feed/Rectangle 1320.png" />
          <img src="assets/images/mockup/feed/Rectangle 1320.png" />
          <img src="assets/images/mockup/feed/Rectangle 1320.png" />
          <img src="assets/images/mockup/feed/Rectangle 1320.png" />
        </div>
      </div>

            <span>Share</span>
          </div>
        </div>
        <div class="info-section2-2">
          <div class="comment-number">{{ item.comment.length }} Comments</div>
        </div>
      </div>
      <div class="info-section3">

            <img src="{{ comment.image }}" />
          </div>

                {{ comment.description }}

              </div>
            </div>
            <div class="sub-comment" *ngFor="let sub_comment of comment.sub_comment">
              <div class="comment">
                <div class="profile-icon">
                  <img src="{{sub_comment.image}}" />
                </div>
                <div class="profile-info">
                  <div class="main-comment">
                    <div class="header">
                      <div class="name">{{sub_comment.name}}</div>
                      <div class="date">{{sub_comment.date}}</div>
                    </div>
                    <div class="description">
                        {{sub_comment.description}}
                    </div>
                    <div class="like">
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="20"
                        height="20"
                        viewBox="0 0 20 20"
                        fill="none"

                        />

                      <span>{{sub_comment.like}}</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="info-section4">
        <div class="btn-wrapper">
          <button class="linear-btn-grandora">
            <span>View more comment</span>
          </button>
        </div>
      </div>
      <div class="info-section5">
        <div class="profile-icon">
          <img src="assets/images/mockup/feed/Group 28545.png" />
        </div>
        <div class="description">
          <textarea
            placeholder="Write a comment"
            [(ngModel)]="description"
          ></textarea>
        </div>
      </div>
      <div class="info-section6">
        <div class="btn-wrapper">
          <button class="secondary-btn" type="button">
            <span>Cancel</span>
          </button>
          <button class="primary-btn" type="button" [disabled]="!description">
            <span>Comment</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
