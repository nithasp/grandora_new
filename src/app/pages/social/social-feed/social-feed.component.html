  <div class="permission" *ngIf="isPermissionDisplay">
    <div class="permission-wrapper">
      <div class="header">View permission</div>
      <div class="content">
        <p>Please select who you when to see this post</p>
        <div class="item-wrapper">
          <div class="item" *ngFor="let item of permission">
            <div class="checkbox-wrapper">
              <label class="grandora-checkbox-container">
                <input type="checkbox" />
                <span class="checkmark"></span>
              </label>
              <p>{{ item.name }}</p>
            </div>
          </div>
        </div>
        <div class="footer">
          <button
            class="secondary-btn"
            type="button"
            (click)="isPermissionDisplay = false"
          >
            <span>Cancel</span>
          </button>
          <button
            class="primary-btn"
            type="button"
            (click)="isPermissionDisplay = false"
          >
            <span>Save</span>
          </button>
        </div>
      </div>
    </div>
  </div>
