        <div class="info">
          <div class="group group1">
            <div class="form-group-grandora">
              <label for="">Username</label>
              <input type="text" placeholder="Your name in Grandora" />
            </div>
          </div>
          <div class="group group2">
            <div class="form-group-grandora">
              <label for="">First name</label>
              <input type="text" placeholder="Your first name" />
            </div>
            <div class="form-group-grandora">
              <label for="">Last name</label>
              <input type="text" placeholder="Your last name" />
            </div>
          </div>
          <div class="group group3">
            <div class="form-group-grandora">
              <label for="">Country</label>
              <app-grandora-select
                [optionItems]="country"
              ></app-grandora-select>
            </div>
            <div class="form-group-grandora">
              <label for="">City</label>
              <app-grandora-select
                [optionItems]="country"
              ></app-grandora-select>
            </div>
          </div>
          <div class="group group4">
            <div class="date-group1">
              <label for="">Birthday</label>
              <div class="select-wrapper">
                <div class="select days">
                  <app-grandora-select
                    [optionItems]="days"
                    optionPlaceholder="Day"
                    (changeTopic)="selectDate($event, 'day')"
                  ></app-grandora-select>
                </div>
                <div class="select months">
                  <app-grandora-select
                    [optionItems]="months"
                    optionPlaceholder="Month"
                    (changeTopic)="selectDate($event, 'month')"
                  ></app-grandora-select>
                </div>
                <div class="select years">
                  <app-grandora-select
                    [optionItems]="years"
                    optionPlaceholder="Year"
                    (changeTopic)="selectDate($event, 'year')"
                  ></app-grandora-select>
                </div>
              </div>
            </div>
            <div class="date-group2">
              <label for="">Age</label>
              <input
                type="text"
                placeholder=""
                readonly
                [value]="age ? age : ''"
              />
            </div>
          </div>
        </div>
      </div>

            <input type="text" placeholder="Your Facebook username" />
          </div>

            <label for="">Twitter</label>
            <input type="text" placeholder="Your Twitter username" />
          </div>
          <div class="form-group-grandora">
            <label for="">Instagram</label>
