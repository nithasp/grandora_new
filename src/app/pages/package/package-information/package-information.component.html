          <div class="point">
            <div class="item" *ngFor="let item of currency">
              <div class="name">{{item?.item_id}}</div>
              <div class="number">{{item?.amount}}</div>
            </div>
          </div>
        </div>
        <app-transactions></app-transactions>
      </div>
      <div class="package-information-section2">
        <h3 class="title">Subscription & Package</h3>
        <div class="content">
          <div class="subscription">
            <h4 class="title">Grandora Subscription</h4>
            <div class="subscription-wrapper">
              <div class="item" *ngFor="let item of subscription">
                <div class="recommended" *ngIf="item?.recommended">
                  Recommended
                </div>
                <div class="wrapper">
                  <div class="subscription-name">{{ item.package_name }}</div>
                  <div class="info" [innerHTML]="item.description"></div>
                </div>
                <div class="permanently" *ngIf="item?.permanently">
                  Permanently
                </div>
                <div class="renew-date" *ngIf="item?.renew_date">
                  Renew date 24/01/2023
                </div>
                <div class="btn-wrapper">
                  <button
                    [ngClass]="item.sub_button ? 'sub-btn' : 'main-btn'"
                    [innerHTML]="item.text_button"
                    [routerLink]="
                      item.isSubscribed ? '../canceling-membership' : null
                    "
                  ></button>
                </div>
              </div>
            </div>
          </div>

          <div class="package">
            <h4 class="title">Currency Package</h4>
            <div class="package-wrapper">
              <div
                class="item"
                *ngFor="let item of package"
                (click)="handlePackage(item)"
              >
                <picture>
                  <source
                    media="(max-width: 768px)"
                    [srcset]="item.url_mobile"
                  />
                  <img [src]="item.url" alt="package-image " />
                </picture>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <app-community></app-community>
</div>
