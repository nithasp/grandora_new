<section id="sign-in">
  <div class="inner">
    <div class="back-btn">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="24"
        viewBox="0 0 18 24"
        fill="none"
        routerLink="../"
      >
        <path
          d="M6 12.8L18 24L12 24L9.79135e-07 12.8L12 -5.24537e-07L18 0L6 12.8Z"
          fill="#5460CB"
        />
      </svg>
      <span>Sign In</span>
    </div>

    <form
      class="signin grandora-form"
      [formGroup]="signInForm"
      (ngSubmit)="handleSignIn()"
    >
      <div class="title">
        <span>Welcome to Grandora</span>
        <span>Sign In</span>
      </div>

      <div class="wrapper">
        <div class="form-group-grandora email">
          <label for="">Email address<span>*</span></label>
          <div
            class="input-wrapper"
            [ngClass]="email.invalid && email.touched ? 'invalid' : ''"
          >
            <input
              type="text"
              placeholder="Enter email address"
              formControlName="email"
            />
          </div>

          <div class="error-msg" *ngIf="email.invalid && email.touched">
            <small class="text-error" *ngIf="email.errors?.['required']"
              >The field is required.</small
            >
            <small class="text-error" *ngIf="email.errors?.['pattern']"
              >Please enter a valid email address.</small
            >
          </div>
        </div>
        <div class="form-group-grandora password">
          <label for="">Password<span>*</span></label>
          <div
            class="input-wrapper"
            [ngClass]="password.invalid && password.touched ? 'invalid' : ''"
          >
            <input
              type="password"
              placeholder="Enter your password"
              formControlName="password"
            />
          </div>

          <div class="error-msg" *ngIf="password.invalid && password.touched">
            <small class="text-error" *ngIf="password.errors?.['required']"
              >The field is required.</small
            >
          </div>
        </div>
        <div class="form-group-grandora checkbox">
          <div class="checkbox-wrapper">
            <label class="grandora-checkbox-container">
              <input type="checkbox" />
              <span class="checkmark"></span>
            </label>
            <p>Remember me</p>
          </div>
          <div class="forgot-password">
            <a routerLink="/forgot-password">Forgot your password?</a>
          </div>
        </div>
        <div class="btn-wrapper">
          <button [disabled]="isLoading">
            <ng-container *ngIf="isLoading">
              <span> Loading... </span>
              <span><lds-roller></lds-roller></span>
            </ng-container>
            <ng-container *ngIf="!isLoading">Log In</ng-container>
          </button>
        </div>
        <div class="social-login">
          <h4>Or sign with</h4>
          <div class="social-icon">
            <button class="facebook">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="27"
                height="26"
                viewBox="0 0 27 26"
                fill="none"
              >
                <path
                  d="M15.2956 25V14.0703H18.8496L19.3779 9.79094H15.2956V7.06518C15.2956 5.83032 15.6272 4.98485 17.3355 4.98485H19.5V1.16959C18.4468 1.05249 17.3882 0.995949 16.329 1.00023C13.1877 1.00023 11.0308 2.98987 11.0308 6.64245V9.78294H7.5V14.0623H11.0386V25H15.2956Z"
                  fill="#4092FF"
                />
              </svg>
            </button>
            <button class="google">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="25"
                height="24"
                viewBox="0 0 25 24"
                fill="none"
              >
                <path
                  d="M5.92191 14.4656L5.09916 17.537L2.09203 17.6006C1.19335 15.9338 0.683594 14.0266 0.683594 12C0.683594 10.0403 1.1602 8.1922 2.00501 6.56494H2.00566L4.68285 7.05576L5.85562 9.71689C5.61016 10.4325 5.47637 11.2007 5.47637 12C5.47647 12.8675 5.63361 13.6987 5.92191 14.4656Z"
                  fill="#FBBB00"
                />
                <path
                  d="M24.1136 9.79199C24.2493 10.5069 24.3201 11.2452 24.3201 11.9998C24.3201 12.8459 24.2311 13.6712 24.0617 14.4673C23.4864 17.1764 21.9831 19.542 19.9006 21.216L19.9 21.2154L16.5279 21.0433L16.0507 18.0641C17.4325 17.2537 18.5124 15.9855 19.0812 14.4673H12.7617V9.79199H19.1734H24.1136Z"
                  fill="#518EF8"
                />
                <path
                  d="M19.9015 21.2153L19.9022 21.216C17.8769 22.8439 15.3041 23.8179 12.5035 23.8179C8.00284 23.8179 4.08987 21.3023 2.09375 17.6004L5.92362 14.4653C6.92166 17.1289 9.49115 19.0251 12.5035 19.0251C13.7983 19.0251 15.0113 18.6751 16.0522 18.064L19.9015 21.2153Z"
                  fill="#28B446"
                />
                <path
                  d="M20.0442 2.90241L16.2156 6.03681C15.1383 5.36345 13.8649 4.97447 12.5007 4.97447C9.42014 4.97447 6.8026 6.95757 5.85456 9.7167L2.00455 6.56475H2.00391C3.9708 2.77255 7.93313 0.181641 12.5007 0.181641C15.3682 0.181641 17.9974 1.20308 20.0442 2.90241Z"
                  fill="#F14336"
                />
              </svg>
            </button>
            <button class="apple">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="23"
                height="26"
                viewBox="0 0 23 26"
                fill="none"
              >
                <path

                  fill="black"
                />
                <path
                  d="M16.6706 0.0130114C16.6154 -0.0487386 14.6248 0.0373864 12.8925 1.91751C11.1603 3.79601 11.4268 5.95076 11.4658 6.00601C11.5048 6.06126 13.9358 6.14739 15.4876 3.96176C17.0395 1.77614 16.7259 0.0763864 16.6706 0.0130114ZM22.0559 19.0791C21.9779 18.9231 18.2778 17.0739 18.6223 13.5184C18.9668 9.96126 21.3441 8.98626 21.3815 8.88064C21.4189 8.77501 20.4114 7.59689 19.3438 7.00051C18.5599 6.58005 17.6923 6.33915 16.8039 6.29526C16.6284 6.29039 16.019 6.14089 14.7661 6.48376C13.9406 6.70964 12.08 7.44089 11.5681 7.47014C11.0546 7.49939 9.52713 6.62189 7.88425 6.38951C6.83288 6.18639 5.71813 6.60239 4.92025 6.92251C4.124 7.24101 2.6095 8.14776 1.55 10.5576C0.490504 12.9659 1.04463 16.7814 1.44113 17.9676C1.83763 19.1523 2.45675 21.0941 3.50975 22.5111C4.44575 24.1101 5.68725 25.22 6.20563 25.597C6.724 25.974 8.1865 26.2243 9.2005 25.7059C10.0163 25.2054 11.4885 24.9178 12.0703 24.9389C12.6504 24.96 13.7944 25.1891 14.966 25.8148C15.8939 26.1349 16.7714 26.0016 17.6505 25.6441C18.5296 25.285 19.802 23.9233 21.2873 21.1624C21.8511 19.8786 22.1079 19.1848 22.0559 19.0791Z"
                  fill="black"
                />
              </svg>
            </button>
          </div>
        </div>
        <div class="signup-wrapper">
          <span>Don’t have an account?</span>
          <a routerLink="/sign-up">Sign Up!</a>
        </div>
      </div>
    </form>
  </div>
</section>
