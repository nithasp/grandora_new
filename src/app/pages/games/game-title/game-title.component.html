<div class="game-title">
  <div class="wrapper">
    <div class="game-picture">
      <div class="main-slide">
        <swiper-container init="false" #mainSlide>
          <swiper-slide *ngFor="let item of mainSlideItems; index as i">
            <div
              class="item"
              (click)="handleChangeMainImage(item)"
              style="background: url('{{ item.image }}') no-repeat;     
              height: 100%;
              background-position: center;
              background-size: cover;"
            ></div>
          </swiper-slide>
        </swiper-container>
       
          <div class="slidePrev-btn">
            <img
              src="/assets/images/community/prev-button.png"
              alt="prev-button"
            />
          </div>
          <div class="slideNext-btn">
            <img
              src="/assets/images/community/next-button.png"
              alt="next-button"
            />
          </div>
       
      </div>
      <div class="main-image">
        <img src="{{ mainImage }}" />
      </div>
    </div>
    <div class="game-info">
      <div class="game-info-section1">
        <div class="info1">All Ages (Suitable for everyone)</div>
        <h1 class="title">Game Title</h1>
        <div class="info2">
          <div class="author">By @cratername</div>
          <div class="age">Age +6</div>
        </div>
        <div class="info3">

      <div class="game-info-section2">
        <div class="btn-wrapper">
          <button class="primary-btn" type="button">
            <span>Save</span>

          <img src="/assets/images/games/heart.png" />

      </div>

  </div>
</div>
